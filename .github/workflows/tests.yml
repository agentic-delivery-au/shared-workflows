name: tests

on:
  pull_request:
    # Default types exclude `edited`, so a retargeted PR keeps a stale result.
    types: [opened, reopened, edited, synchronize]
  push:
    branches: [main]

# An in-progress run on `main` is not cancelled; a newer push replaces only a pending one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The job id is the status check context ruleset_payload() requires in
  # scripts/bootstrap_repo.py; renaming it blocks every pull request.
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # setup-uv stopped publishing floating major tags after v7, so v10 404s.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      # --frozen would install from a lockfile that no longer matches pyproject.
      - run: uv sync --locked
      - run: uv run --no-sync pytest
