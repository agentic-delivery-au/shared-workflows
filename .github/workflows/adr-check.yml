name: adr-check

# Reusable: callers pin a release tag and own their triggers. Docs: docs/adr-check-workflow.md.

on:
  workflow_call:
    inputs:
      adr-check-version:
        description: adr-check version on PyPI, for example `0.1.1`. Match the pre-commit hook's.
        type: string
        required: true
      adr-dir:
        description: Directory that holds the ADRs
        type: string
        default: docs/adr
      base-ref:
        description: Ref to compare the ADRs with. Defaults to `origin/<base branch>` on a pull request.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  adr-check:
    runs-on: ubuntu-latest
    steps:
      # Full history, because ci mode diffs against the base branch.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # setup-uv publishes no bare major tag after v7, so pin a full version: @v10 404s.
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Run adr-check
        env:
          ADR_CHECK_VERSION: ${{ inputs.adr-check-version }}
          ADR_DIR: ${{ inputs.adr-dir }}
          BASE_REF: ${{ inputs.base-ref || (github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '') }}
          EVENT_NAME: ${{ github.event_name }}
          MERGING_TO_MAIN: ${{ (github.event_name == 'pull_request' && github.base_ref == github.event.repository.default_branch) || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          args=(--adr-dir "$ADR_DIR")
          if [[ "$MERGING_TO_MAIN" == "true" ]]; then
            args+=(--merging-to-main)
          fi
          if [[ "$EVENT_NAME" == "push" ]]; then
            # A push has no PR labels, so comparing here would fail every merged adr-correction.
            echo "::notice::A push runs only the checks on the files."
          elif [[ -z "$BASE_REF" ]]; then
            echo "::error::base-ref is empty. Call this workflow on pull_request or push, or set base-ref."
            exit 1
          else
            args+=(--mode ci --base-ref "$BASE_REF" --labels "$LABELS")
          fi
          uvx "adr-check==$ADR_CHECK_VERSION" "${args[@]}"
